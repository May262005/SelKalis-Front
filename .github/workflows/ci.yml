name: CI - Pruebas Automatizadas SelKalis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar proveedor de navegador para Vitest
        run: npm install --save-dev @vitest/browser-playwright playwright

      - name: Ejecutar pruebas unitarias
        run: npm test -- --watch=false --browsers=chromium --browser.enabled=true
