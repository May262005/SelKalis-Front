<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <h2>Iniciar sesión</h2>
      <p>Bienvenido de nuevo a SelKalis</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form" #loginForm="ngForm">

      <div class="form-group">
        <label>Correo electrónico</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          required
          [disabled]="isLoading"
          autocomplete="off"
          (input)="onInputChange()"
        >
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
            [disabled]="isLoading"
            autocomplete="new-password"
            (input)="onInputChange()"
          >
          <button
            type="button"
            class="toggle-password-btn"
            (click)="togglePassword()"
            [disabled]="isLoading"
            tabindex="-1"
          >
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-checkbox">
          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="rememberMe"
            [disabled]="isLoading"
            (change)="onRememberMeChange()"
          >
          <span class="custom-checkbox-remember"></span>
          <span class="remember-label">Recordarme</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <i *ngIf="isLoading" class="fas fa-spinner fa-spin"></i>
        <span *ngIf="!isLoading">Ingresar</span>
        <span *ngIf="isLoading">Iniciando sesión...</span>
      </button>

    </form>

    <!-- Botón de biometría discreto -->
    <div class="biometria-inline" *ngIf="biometriaDisponible && biometriaRegistrada">
      <div class="biometria-divider">
        <span>o</span>
      </div>
      <button type="button" class="btn-biometria-inline" (click)="loginConBiometria()" [disabled]="biometriaCargando || isLoading">
        <i class="fas" [class.fa-fingerprint]="!biometriaCargando" [class.fa-spinner]="biometriaCargando" [class.fa-spin]="biometriaCargando"></i>
        <span>Entrar con huella / Face ID</span>
      </button>
      <p class="biometria-error" *ngIf="biometriaError">{{ biometriaError }}</p>
    </div>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/registro" class="link-primary link-bold">Regístrate aquí</a></p>
      <a class="link-primary link-bold" routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
    </div>

  </div>
</div>

<!-- MODAL: VINCULAR TELÉFONO -->
<div class="modal-telefono-overlay" *ngIf="mostrarModalTelefono">
  <div class="modal-telefono">
    <div class="modal-telefono-icon">
      <i class="fas fa-phone"></i>
    </div>
    <h3>Vincula tu número telefónico</h3>
    <p class="modal-telefono-desc">
      Para identificar tu dispositivo y poder enviarte recordatorios importantes, necesitamos tu número.
    </p>
    
    <input
      type="tel"
      class="modal-telefono-input"
      [(ngModel)]="telefonoModal"
      placeholder="+52 55 1234 5678"
      [disabled]="telefonoModalCargando"
      autocomplete="off"
      autofocus
    />
    
    <p class="modal-telefono-error" *ngIf="telefonoModalError">{{ telefonoModalError }}</p>
    
    <button class="btn-modal-azul" (click)="guardarTelefonoModal()" [disabled]="telefonoModalCargando">
      <i class="fas" [class.fa-check]="!telefonoModalCargando" [class.fa-spinner]="telefonoModalCargando" [class.fa-spin]="telefonoModalCargando"></i>
      <span *ngIf="!telefonoModalCargando">Guardar y continuar</span>
      <span *ngIf="telefonoModalCargando">Guardando...</span>
    </button>
  </div>
</div>
