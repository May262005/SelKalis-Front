<div class="tratamientos-container">

  <div class="hero">
    <h1>Seguridad <span>Móvil</span></h1>
    <p>Hola {{ userEmail }}, gestiona el acceso biométrico y la vinculación de tu dispositivo.</p>
  </div>

  <div class="search-section" style="justify-content: flex-start;">
    <button class="btn-add" (click)="abrirModulo()" style="padding: 10px 24px; font-size: 14px;">
      <i class="fas fa-mobile-alt"></i> Abrir Módulo Flutter de Seguridad
    </button>
  </div>

  <div class="tratamiento-card" style="text-align: center; padding: 60px 20px;">
    <div class="confirm-icon" style="margin: 0 auto 20px; width: 80px; height: 80px; font-size: 32px;">
      <i class="fas fa-shield-alt"></i>
    </div>
    <h2 style="color: #1F3A5F; font-size: 24px; margin-bottom: 12px;">Módulo de Seguridad (Flutter)</h2>
    <p style="color: #7B8CA8; line-height: 1.6; margin-bottom: 24px; max-width: 500px; margin-left: auto; margin-right: auto;">
      Este módulo se encarga de vincular tu número telefónico, asociar el dispositivo actual y gestionar la autenticación biométrica.
    </p>
  </div>

</div>

<!-- MODAL CON FLUTTER EMBEBIDO -->
<div class="modal-overlay" *ngIf="mostrarModal" (click)="cerrarModulo()">
  <div class="modal-container modal-large" (click)="$event.stopPropagation()" style="max-width: 900px; height: 85vh; display: flex; flex-direction: column; padding: 0; overflow: hidden;">
    
    <div class="modal-header" style="flex-shrink: 0;">
      <h3><i class="fas fa-shield-alt"></i> Módulo Flutter - Seguridad</h3>
      <button class="modal-close" (click)="cerrarModulo()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div style="flex: 1; position: relative; background: #f5f7fa;">
      <iframe 
        [src]="flutterUrl" 
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
        allow="camera; microphone; publickey-credentials-get; publickey-credentials-create">
      </iframe>
    </div>

  </div>
</div>
