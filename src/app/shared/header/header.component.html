<header class="header">
  <div class="header-left">
    <button class="mobile-menu-btn" (click)="menuService.toggle()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="logo" (click)="goToLanding()">
      <img src="/logo_mc.png" alt="SelKalis" class="logo-img">
      <span class="logo-text">Sel<span>Kalis</span></span>
    </div>
  </div>

  <ng-container *ngIf="esAdmin; else userNavigation">
    <nav class="nav-tabs admin-nav-tabs">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="tab">Inicio</a>
      <a routerLink="/admin/usuarios" routerLinkActive="active" class="tab">Usuarios</a>
      <a routerLink="/soporte" routerLinkActive="active" class="tab">Mesa de ayuda</a>
    </nav>
  </ng-container>
  <ng-template #userNavigation>
    <nav class="nav-tabs">
      <a routerLink="/dashboard" routerLinkActive="active" class="tab">Dashboard</a>
      <a routerLink="/tratamientos" routerLinkActive="active" class="tab">Tratamientos</a>
      <a routerLink="/citas" routerLinkActive="active" class="tab">Citas</a>
      <a routerLink="/estudios" routerLinkActive="active" class="tab">Estudios</a>
      <a routerLink="/documentos" routerLinkActive="active" class="tab">Documentos</a>
      <a routerLink="/soporte" routerLinkActive="active" class="tab">Soporte</a>
    </nav>
  </ng-template>

  <div class="header-right">
    <div class="notifications-control">
      <button class="notifications-button"
              type="button"
              aria-label="Abrir notificaciones"
              [attr.aria-expanded]="notificationsOpen"
              (click)="toggleNotifications()">
        <i class="fas fa-bell"></i>
        <span class="notification-count" *ngIf="unreadCount">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      </button>
      <section class="notifications-panel" *ngIf="notificationsOpen" aria-label="Notificaciones">
        <div class="notifications-panel-header">
          <strong>Notificaciones</strong>
          <button type="button" class="mark-all-read" (click)="marcarTodasLeidas()" [disabled]="!unreadCount">
            Marcar leídas
          </button>
        </div>
        <p class="notifications-empty" *ngIf="!notifications.length">No tienes notificaciones.</p>
        <button class="notification-entry"
                type="button"
                *ngFor="let notification of notifications"
                [class.unread]="!notification.read_at"
                (click)="abrirNotificacion(notification)">
          <span class="notification-entry-icon">
            <i class="fas"
               [class.fa-pills]="notification.tipo === 'medicamento'"
               [class.fa-calendar-check]="notification.tipo === 'cita'"
               [class.fa-life-ring]="notification.tipo === 'soporte'"></i>
          </span>
          <span class="notification-entry-content">
            <strong>{{ notification.titulo }}</strong>
            <span>{{ notification.mensaje }}</span>
            <small>{{ notification.created_at | date:'short' }}</small>
          </span>
        </button>
      </section>
    </div>
    <div class="user-menu">
      <div class="user-avatar" (click)="toggleMenu()">
        <span>{{ iniciales }}</span>
      </div>
      <!-- Dropdown menu -->
      <div class="dropdown-menu" *ngIf="menuAbierto">
        <a routerLink="/perfil" class="dropdown-item" (click)="cerrarMenu()">
          <i class="fas fa-user"></i>
          <span>Mi Perfil</span>
        </a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item logout" (click)="cerrarSesion()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </div>
</header>

<aside class="permission-setup-notice" *ngIf="setupNoticeVisible">
  <div>
    <strong>Configura tus opciones de privacidad</strong>
    <p>Administra notificaciones, biometría y el estado del permiso de cámara desde tu perfil.</p>
  </div>
  <div class="permission-setup-actions">
    <button type="button" class="setup-link" (click)="configurarPermisos()">Configurar</button>
    <button type="button" class="setup-dismiss" aria-label="Cerrar aviso" (click)="descartarAvisoConfiguracion()">
      <i class="fas fa-times"></i>
    </button>
  </div>
</aside>
